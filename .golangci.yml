run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gofmt
    - govet
    - ineffassign
    - misspell
    - unused
    - staticcheck

linters-settings:
  gofmt:
    simplify: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0