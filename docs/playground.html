<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کلنگ — محیط آزمایش</title>
  <meta name="description" content="محیط آزمایش زبان برنامه‌نویسی کلنگ — کد بنویسید و مستقیماً در مرورگر اجرا کنید.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d9488'/><text x='50' y='72' font-size='62' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>ک</text></svg>">

  <link rel="stylesheet" href="playground.css">

  <!-- Go WASM glue — classic script, defines globalThis.Go -->
  <script src="wasm/wasm_exec.js"></script>

  <!-- Import map: resolve bare CM6 specifiers to esm.sh CDN.
       ?external= ensures all packages share ONE instance of
       @codemirror/state (avoids "duplicate Facet" runtime errors). -->
  <script type="importmap">
  {
    "imports": {
      "@codemirror/state": "https://esm.sh/@codemirror/state@6",
      "@codemirror/view": "https://esm.sh/@codemirror/view@6?external=@codemirror/state",
      "@codemirror/language": "https://esm.sh/@codemirror/language@6?external=@codemirror/state,@codemirror/view,@lezer/highlight,@lezer/common",
      "@codemirror/autocomplete": "https://esm.sh/@codemirror/autocomplete@6?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/highlight,@lezer/common",
      "@codemirror/commands": "https://esm.sh/@codemirror/commands@6?external=@codemirror/state,@codemirror/view,@codemirror/language",
      "@codemirror/search": "https://esm.sh/@codemirror/search@6?external=@codemirror/state,@codemirror/view,@codemirror/language",
      "@lezer/highlight": "https://esm.sh/@lezer/highlight@1",
      "@lezer/common": "https://esm.sh/@lezer/common@1"
    }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#editor">پرش به ویرایشگر</a>

  <!-- ============================================================ HEADER -->
  <header class="pg-header">
    <a class="pg-brand" href="index.html" aria-label="کلنگ — خانه">
      <span class="brand-mark">ک</span>
      <span>محیط آزمایش کلنگ</span>
    </a>
    <nav class="pg-nav">
      <a href="index.html">مستندات</a>
      <a href="https://github.com/faralidev/kolang" target="_blank" rel="noopener">GitHub</a>
      <a href="https://github.com/faralidev/kolang-ide" target="_blank" rel="noopener">ویرایشگر کلنگ</a>
    </nav>
    <button id="theme-toggle" class="pg-theme-toggle" type="button" aria-label="تغییر حالت روشن/تاریک" aria-pressed="false">
      <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </header>

  <!-- ======================================================= EXAMPLES -->
  <div class="pg-examples-bar">
    <span class="pg-examples-label">مثال‌ها:</span>
    <div class="pg-examples-scroll">
      <button class="pg-example-btn" data-example="hello">سلام دنیا</button>
      <button class="pg-example-btn" data-example="math">حساب</button>
      <button class="pg-example-btn" data-example="loop">حلقه</button>
      <button class="pg-example-btn" data-example="func">تابع</button>
      <button class="pg-example-btn" data-example="oop">شیءگرایی</button>
      <button class="pg-example-btn" data-example="concurrency">همزمانی</button>
    </div>
  </div>

  <!-- ======================================================= PLAYGROUND -->
  <main class="pg-grid">
    <section class="pg-panel pg-editor-panel">
      <div class="pg-panel-header">
        <span class="pg-panel-title">کد</span>
        <div class="pg-panel-actions">
          <kbd class="pg-shortcut-hint">Ctrl+Enter</kbd>
          <button id="run-btn" class="pg-run-btn" type="button" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <span>اجرا</span>
          </button>
        </div>
      </div>
      <div id="editor" class="pg-editor-container" aria-label="ویرایشگر کد کلنگ"></div>
    </section>

    <section class="pg-panel pg-output-panel">
      <div class="pg-panel-header">
        <span class="pg-panel-title">خروجی</span>
        <div class="pg-panel-actions">
          <button id="clear-btn" class="pg-clear-btn" type="button">پاک کردن</button>
        </div>
      </div>
      <pre id="output" class="pg-output" dir="rtl"><span class="pg-output-placeholder">برای اجرا، دکمهٔ «اجرا» را بزنید (Ctrl+Enter)</span></pre>
    </section>
  </main>

  <!-- ================================================== LOADING OVERLAY -->
  <div id="loading-overlay" class="pg-loading-overlay">
    <div class="pg-loading-card">
      <div class="pg-spinner" aria-hidden="true"></div>
      <p class="pg-loading-text">در حال بارگذاری مفسر…</p>
      <p class="pg-loading-sub">فایل WebAssembly (۳.۵ مگابایت) دانلود می‌شود</p>
    </div>
  </div>

  <!-- ============================================================ JS -->
  <script type="module" src="playground.js"></script>
</body>
</html>
