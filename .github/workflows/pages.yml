name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimal permissions for a static GitHub Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one in-flight deploy at a time; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The "docs/" folder is static HTML/CSS — nothing to build.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
